plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.callservice'
version = '1.0.0'

android {
  namespace "expo.modules.callservice"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // the headless task that keeps the app's timers running
  implementation 'com.facebook.react:react-android'
}
